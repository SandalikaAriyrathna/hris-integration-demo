spring.application.name=hris-integration-demo

server.address=127.0.0.1
server.port=5001

spring.datasource.url=${DEMO_DB_URL}
spring.datasource.username=${DEMO_DB_USERNAME}
spring.datasource.password=${DEMO_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true

server.servlet.session.cookie.name=hris_demo_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${DEMO_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

server.error.include-message=never
server.error.include-stacktrace=never

app.frontend-origin=http://localhost:5174

app.excom.backend-url=${EXCOM_BACKEND_URL}
app.excom.frontend-url=${EXCOM_FRONTEND_URL}
app.excom.client-id=${EXCOM_INTEGRATION_CLIENT_ID}
app.excom.api-key=${EXCOM_INTEGRATION_KEY}
app.demo.seed-enabled=${DEMO_SEED_ENABLED:false}